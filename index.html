<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PC案内ツール - チェックリスト</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>PC案内ツール</h1>
    <nav>
      <a href="tips.html" class="icon-link" aria-label="Tips／知識ページ" title="Tips／知識ページ">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2a7 7 0 0 0-4.1 12.7c.7.5 1.1 1.4 1.1 2.3h6c0-.9.4-1.8 1.1-2.3A7 7 0 0 0 12 2z"></path>
          <line x1="9.5" y1="20" x2="14.5" y2="20"></line>
          <line x1="10.5" y1="22.5" x2="13.5" y2="22.5"></line>
        </svg>
        <span class="icon-link-text">Tips</span>
      </a>
    </nav>
  </header>

  <main class="checklist-layout">
    <section class="questions-col" id="questions">
      <!-- pc.json から質問を描画 -->
    </section>

    <aside class="summary-col">
      <div class="summary-head">
        <h2>条件サマリー</h2>
        <button type="button" id="reset-btn">リセット</button>
      </div>
      <div id="summary">
        <p class="placeholder">項目を選ぶとここに条件が表示されます</p>
      </div>
    </aside>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
